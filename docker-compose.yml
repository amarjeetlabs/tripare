version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - redis
      - temporal
    command: node dist/server.js

  worker:
    build: .
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    command: node dist/worker.js
